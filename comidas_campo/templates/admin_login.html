{% extends "base.html" %}
{% block title %}Acceso administrador — Comidas Campo{% endblock %}
{% block content %}
<div class="card card-narrow">
  <h1>Acceso de administrador</h1>
  <p class="muted">El administrador puede crear eventos, configurar fechas, gestionar familias y cerrar la liquidación.</p>
  <form method="post" action="{{ url_for('admin_login') }}">
    <label for="password">Contraseña de administrador</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit" class="primary">Activar modo admin</button>
  </form>
  <p><a href="{{ url_for('index') }}">← Volver</a></p>
</div>
{% endblock %}
