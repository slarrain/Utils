# Configuración de despliegue de Comidas Campo al NAS Synology.
# Este archivo NO contiene contraseñas (el SECRET_KEY se genera solo y las
# contraseñas vienen incrustadas en la imagen, ver app.py).

NAS_HOST="192.168.1.200"          # IP o hostname del NAS
NAS_USER="santiago"               # usuario con el que haces SSH al NAS
NAS_SSH_PORT="22"                 # puerto SSH (DSM por defecto: 22)

APP_PORT="9876"                   # puerto externo -> http://NAS_HOST:APP_PORT/
NAS_DATA_DIR="/volume1/docker/comidas-campo"   # carpeta en el NAS para los datos

CONTAINER_NAME="comidas-campo"    # nombre del contenedor
IMAGE_NAME="comidas-campo"        # nombre de la imagen

USE_SUDO="yes"                    # en Synology normalmente "yes"
