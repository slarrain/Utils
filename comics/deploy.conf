# Configuración de despliegue de comics-bot al NAS Synology.
# Las credenciales van en deploy.secrets (fuera de git).

NAS_HOST="192.168.1.200"          # IP o hostname del NAS
NAS_USER="santiago"               # usuario con el que haces SSH al NAS
NAS_SSH_PORT="22"                 # puerto SSH

CONTAINER_NAME="comics-bot"
IMAGE_NAME="comics-bot"

NAS_DATA_DIR="/volume1/docker/comics-bot"       # estado del bot (sesión, hints)
NAS_INBOX_DIR="/volume1/NAS/downloads/COMICS"   # compartido con JDownloader (/output/COMICS)
NAS_LIBRARY_DIR="/volume1/NAS/comics"           # biblioteca que leen Komga/Codex/Mylar

# Cómo ve JDownloader (dentro de SU contenedor) la carpeta NAS_INBOX_DIR:
JD_DOWNLOAD_ROOT="/output/COMICS"

KOMGA_URL="http://192.168.1.200:8341"

USE_SUDO="yes"                    # en Synology normalmente "yes"
